<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      .cont-input-login{
        display: grid;
        gap: 10px;
        width: 400px;
        max-width: calc(100vw - 48px);
      }
      .cont-login{
        display: flex;
        gap: 6px;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        width: 100%;
      }
      input{
        height: 40px;
        border-radius: 100px;
        padding-left: 10px;
        border: 1px solid #d6d6d6;
        outline: none;
      }
      input:focus{
        border-color: #0b3d91;
      }
      body{
        display: flex;
        min-height: 100vh;
        margin: 0;
        align-items: center;
        justify-content: center;
      }
      button{
          width: 200px;
          height: 50px;
          border-radius: 100px;
          margin-top: 10px;
          border: none;
          background: #0b3d91;
          color: white;
          font-weight: 700;
          cursor: pointer;
      }
      button:disabled{
        opacity: .65;
        cursor: wait;
      }
      .login-message{
        width: 400px;
        max-width: calc(100vw - 48px);
        min-height: 20px;
        font-size: 13px;
        text-align: center;
        color: #b42318;
        font-weight: 600;
      }
      .login-message.success{
        color: #067647;
      }
    </style>
  </head>
  <body>
    <div class="cont-login">
      <h1 style="text-align: center;">Registo</h1>
      <div class="cont-input-login">
        <input type="text" placeholder="Nome" id="nom" autocomplete="name">
        <input type="tel" placeholder="Telefone" id="numero" autocomplete="tel">
        <input type="email" placeholder="Email opcional" id="email" autocomplete="email">
        <input type="text" placeholder="Chave de licenca" id="license" autocomplete="off" oninput="formatLicenseInput(this)">
      </div>
      <div id="login-message" class="login-message"></div>
      <button id="login-btn" onclick="login()">Ativar</button>
    </div>
  </body>
 <script>
  var WEBAPP_SPREADSHEET_ID = <?!= JSON.stringify(typeof spreadsheetId !== 'undefined' ? spreadsheetId : '') ?>;


  function showMessage(text, type) {
    var box = document.getElementById('login-message');
    box.textContent = text || '';
    box.className = 'login-message' + (type === 'success' ? ' success' : '');
  }

  function normalizeLicense(value) {
    return String(value || '').trim().toUpperCase().replace(/\s+/g, '');
  }

  function formatLicenseInput(input) {
    input.value = normalizeLicense(input.value);
  }

  function login() {
  var btn = document.getElementById('login-btn');

  var data = {
    nom: document.getElementById('nom').value.trim(),
    numero: document.getElementById('numero').value.trim(),
    email: document.getElementById('email').value.trim(),
    licence: normalizeLicense(document.getElementById('license').value),
    statut: "active"
  };

  if (!data.nom || !data.numero || !data.licence) {
    showMessage('Preenche nome, telefone e chave de licenca.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'A verificar...';
  showMessage('');

  google.script.run
    .withSuccessHandler(function(resultat) {
      if (!resultat || resultat.ok === false) {
        showMessage((resultat && resultat.message) || 'Erro ao ativar licenca.');
        btn.disabled = false;
        btn.textContent = 'Ativar';
        return;
      }

      var dataResult = resultat.data;

      if (!dataResult || dataResult.ok === false || !dataResult.spreadsheetId) {
        showMessage((dataResult && dataResult.message) || 'Licenca invalida.');
        btn.disabled = false;
        btn.textContent = 'Ativar';
        return;
      }

      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          flex-direction:column;
          font-family:Arial,sans-serif;
          text-align:center;
        ">
          <h1 style="color:#0b3d91;">Licenca ativada</h1>
          <p style="font-size:16px;">Bem-vindo ao Azul Gestao</p>
          <p style="color:#777;">Abrindo sistema...</p>
        </div>
      `;

      setTimeout(function() {
        window.location.href = window.location.origin + window.location.pathname +
          '?spreadsheetId=' + encodeURIComponent(dataResult.spreadsheetId);
      }, 1000);
    })
    .withFailureHandler(function(e) {
      showMessage((e && e.message) ? e.message : 'Erro ao ativar licenca.');
      btn.disabled = false;
      btn.textContent = 'Ativar';
    })
    .apiCall({
      action: 'saveUtilisateur',
      spreadsheetId: 'login',
      data: data
    });
}


</script>
</html>
